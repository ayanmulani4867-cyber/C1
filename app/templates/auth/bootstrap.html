<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect ERP</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style id="erp-bootstrap-style">
        :root {
            --cc-primary: #1e3a8a;
            --cc-surface: #f8fafc;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }
        .bootstrap-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cc-surface);
            padding: 1.5rem;
        }
        .bootstrap-card {
            background: #ffffff;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .spinner-custom {
            width: 3rem;
            height: 3rem;
            border-width: 0.25em;
            color: var(--cc-primary);
        }
    </style>
</head>
<body class="bg-light">
    <div class="bootstrap-wrapper">
        <div id="erp-bootstrap-root" class="bootstrap-card">
            <div class="spinner-border spinner-custom mb-3" role="status">
                <span class="visually-hidden">Loading Campus Connect...</span>
            </div>
            <h5 class="fw-bold text-dark mb-1">Campus Connect ERP</h5>
            <p class="text-muted small mb-0">Restoring authenticated session...</p>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/erp_multitab_auth.js') }}" id="erp-multitab-auth-script"></script>
    <script id="erp-bootstrap-script">
        (function() {
            const TOKEN_KEY = 'CAMPUS_CONNECT_ERP_token';
            let token = null;
            try {
                token = sessionStorage.getItem(TOKEN_KEY);
            } catch (e) {}

            const currentUrl = window.location.pathname + window.location.search + window.location.hash;

            if (!token) {
                // No per-tab token found in this tab -> direct to login
                window.location.replace('/auth/login?next=' + encodeURIComponent(currentUrl));
                return;
            }

            // Execute authenticated fetch with per-tab Bearer token
            fetch(window.location.href, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-ERP-Client': 'web'
                }
            })
            .then(function(res) {
                if (res.status === 401 || res.status === 403) {
                    try { sessionStorage.removeItem(TOKEN_KEY); } catch(e) {}
                    window.location.replace('/auth/login?next=' + encodeURIComponent(currentUrl));
                    return null;
                }
                if (res.redirected) {
                    window.history.replaceState({}, '', res.url);
                }
                return res.text();
            })
            .then(function(html) {
                if (html && window.__erp_renderPage) {
                    window.__erp_renderPage(html, window.location.href);
                }
            })
            .catch(function(err) {
                console.error('Bootstrap fetch error:', err);
                const root = document.getElementById('erp-bootstrap-root');
                if (root) {
                    root.innerHTML = '<div class="alert alert-danger mb-0"><i class="fa-solid fa-triangle-exclamation me-2"></i>Unable to connect to portal. <a href="/auth/login" class="alert-link d-block mt-2">Go to Sign In</a></div>';
                }
            });
        })();
    </script>
</body>
</html>
